apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zabbix-apm.fullname" . }}-clickhouse
  labels:
    {{- include "zabbix-apm.labels" . | nindent 4 }}
type: Opaque
stringData:
  CLICKHOUSE_USER: {{ .Values.clickhouse.username | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.clickhouse.password | quote }}
  CLICKHOUSE_DB: {{ .Values.clickhouse.database | quote }}
  CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zabbix-apm.fullname" . }}-clickhouse
  labels:
    {{- include "zabbix-apm.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Keep the headless DNS record during readiness transitions on upgrades.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: {{ include "zabbix-apm.name" . }}-clickhouse
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zabbix-apm.fullname" . }}-clickhouse
  labels:
    {{- include "zabbix-apm.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "zabbix-apm.fullname" . }}-clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "zabbix-apm.name" . }}-clickhouse
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "zabbix-apm.name" . }}-clickhouse
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: clickhouse
          image: "{{ .Values.images.clickhouse.repository }}:{{ .Values.images.clickhouse.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          envFrom:
            - secretRef:
                name: {{ include "zabbix-apm.fullname" . }}-clickhouse
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: logs
              mountPath: /var/log/clickhouse-server
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: {{ .Values.clickhouse.storageClassName | quote }}
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.clickhouse.storage }}
    - metadata:
        name: logs
      spec:
        storageClassName: {{ .Values.clickhouse.storageClassName | quote }}
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
