apiVersion: v1
kind: Service
metadata:
  name: {{ include "zabbix.fullname" . }}-web
  labels:
    {{- include "zabbix.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "zabbix.name" . }}-web
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zabbix.fullname" . }}-web
  labels:
    {{- include "zabbix.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "zabbix.name" . }}-web
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "zabbix.name" . }}-web
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.web.apmCurlCloseCompat }}
      initContainers:
        - name: apm-php-compat
          image: "{{ .Values.images.web.repository }}:{{ .Values.images.web.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -ec
            - |
              source=/usr/share/zabbix/include/classes/db/ApmDbClickHouse.php
              test -r "$source"
              # Only remove standalone no-op calls. Preserve error handling.
              sed '/^[[:space:]]*curl_close([^;]*);[[:space:]]*$/d' "$source" > /compat/ApmDbClickHouse.php
              chmod 644 /compat/ApmDbClickHouse.php
          volumeMounts:
            - name: apm-php-compat
              mountPath: /compat
      {{- end }}
      containers:
        - name: zabbix-web
          image: "{{ .Values.images.web.repository }}:{{ .Values.images.web.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          {{- if .Values.web.apmCurlCloseCompat }}
          volumeMounts:
            - name: apm-php-compat
              mountPath: /usr/share/zabbix/include/classes/db/ApmDbClickHouse.php
              subPath: ApmDbClickHouse.php
              readOnly: true
          {{- end }}
          env:
            - name: ZBX_SERVER_HOST
              value: {{ include "zabbix.fullname" . }}-server
            - name: DB_SERVER_HOST
              value: {{ include "zabbix.fullname" . }}-postgres
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ include "zabbix.secretName" . }}, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "zabbix.secretName" . }}, key: POSTGRES_PASSWORD}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: {{ include "zabbix.secretName" . }}, key: POSTGRES_DB}}
            - name: PHP_TZ
              value: {{ .Values.web.timezone | quote }}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
      {{- if .Values.web.apmCurlCloseCompat }}
      volumes:
        - name: apm-php-compat
          emptyDir: {}
      {{- end }}
