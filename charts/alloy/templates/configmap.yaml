apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alloy.fullname" . }}-config
  labels:
    {{- include "alloy.labels" . | nindent 4 }}
data:
  config.alloy: |
    logging {
      level = "info"
    }

    otelcol.receiver.otlp "apps" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }

      output {
        logs = [otelcol.exporter.otlp.zabbix.input]
      }
    }

    otelcol.exporter.otlp "zabbix" {
      client {
        endpoint = "{{ .Values.zabbixEndpoint }}"
        tls {
          insecure = true
        }
      }
    }
