apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-collector.fullname" . }}-config
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
      prometheus:
        config:
          scrape_configs:
            - job_name: chaos-app
              scrape_interval: 5s
              metrics_path: /metrics/
              static_configs:
                - targets: [chaos-app:80]
    processors:
      batch:
        timeout: 1s
    exporters:
      {{- if .Values.exportToProxy }}
      otlp/zabbix:
        endpoint: {{ .Values.zabbixEndpoint }}
        tls:
          insecure: true
      {{- end }}
      clickhouse:
        endpoint: {{ .Values.clickhouse.endpoint }}
        database: {{ .Values.clickhouse.database }}
        username: ${env:CLICKHOUSE_USERNAME}
        password: ${env:CLICKHOUSE_PASSWORD}
        create_schema: true
        async_insert: false
        timeout: 5s
        metrics_tables:
          exponential_histogram:
            name: otel_metrics_exponential_histogram
        retry_on_failure:
          enabled: true
          initial_interval: 2s
          max_interval: 10s
          max_elapsed_time: 60s
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [clickhouse, debug{{ if .Values.exportToProxy }}, otlp/zabbix{{ end }}]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [clickhouse, debug{{ if .Values.exportToProxy }}, otlp/zabbix{{ end }}]
        metrics:
          receivers: [otlp, prometheus]
          processors: [batch]
          exporters: [clickhouse, debug{{ if .Values.exportToProxy }}, otlp/zabbix{{ end }}]
