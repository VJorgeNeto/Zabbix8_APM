apiVersion: v1
kind: Service
metadata:
  name: {{ include "dependency-api.fullname" . }}
  labels:
    {{- include "dependency-api.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dependency-api.labels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  type: ClusterIP
